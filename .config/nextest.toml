# Test runner profiles (ver §2 rule 4, FND-02). `retries = 0` everywhere: a test that passes on a
# rerun is a race to find, never a flake. A slow test is reported after 30 s and terminated after
# four periods.

[test-groups]
# Tests that start the daemon or a JVM share the lane's budget (ADR 0018: at most two lanes, each
# with two build jobs). Such a test lives in a module named `daemon_or_jvm` (nextest refuses a
# `binary()` filter that matches no binary yet, so the convention is on the test path).
daemon-or-jvm = { max-threads = 2 }
# Tests that run a nested cargo, clippy or cargo-deny over a fixture workspace (the gate's negative
# cases, tools/jfl-architecture/tests/): each is a build, so two at a time.
nested-cargo = { max-threads = 2 }

[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(/(^|::)daemon_or_jvm::/)'
test-group = 'daemon-or-jvm'

[[profile.default.overrides]]
filter = 'package(jfl-architecture) & kind(test)'
test-group = 'nested-cargo'

# CI: every failure reported, JUnit for the job summary (target/nextest/ci/junit.xml).
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# One test at a time: for a test that measures or must run alone.
[profile.serial]
retries = 0
test-threads = 1
slow-timeout = { period = "30s", terminate-after = 4 }
