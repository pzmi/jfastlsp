# The architecture policy (fnd §3.1, ADR 0010). Parsed strictly by the architecture test
# (FND-07); FND-01 writes the tables, FND-02 and FND-07 enforce them. A crate belongs to exactly
# one category; the edge table is plan §6.3; the grants are fnd §2.4.
schema = 1

[workspace]
production = ["jfl-domain", "jfl-protocol", "jfl-application", "jfl-process", "jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-java", "jfl-adapter-classfile", "jfl-adapter-store", "jfl-adapter-ipc", "jfl-adapter-lsp", "jfl-adapter-javac", "jfl-adapter-gradle", "jfl-composition", "jfl-cli"]
test_only = ["jfl-testkit", "jfl-conformance", "jfl-architecture"]
tool_only = ["jfl-oracle", "jfl-eval", "jfl-bench", "xtask"]
# fuzz_only = ["jfl-fuzz"] arrives with REL-03 (its own workspace under fuzz/).

[roles]
pure = ["jfl-domain", "jfl-protocol"]
application = ["jfl-application"]
support = ["jfl-process"]
adapter = ["jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-java", "jfl-adapter-classfile", "jfl-adapter-store", "jfl-adapter-ipc", "jfl-adapter-lsp", "jfl-adapter-javac", "jfl-adapter-gradle"]
root = ["jfl-composition", "jfl-cli"]

# What each crate's clippy.toml may drop from the canonical disallowed list (fnd §2.4). The
# git, javac and gradle adapters spawn only through jfl-process, so they hold no process grant.
[grants]
process = ["jfl-process", "jfl-testkit", "jfl-architecture", "jfl-bench", "jfl-eval", "xtask"]
socket = ["jfl-adapter-ipc"]
fs = ["jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-store", "jfl-adapter-classfile", "jfl-adapter-javac", "jfl-adapter-gradle", "jfl-adapter-ipc", "jfl-composition", "jfl-testkit", "jfl-conformance", "jfl-architecture", "jfl-bench", "jfl-eval", "jfl-oracle", "xtask"]
spawn = ["jfl-adapter-ipc", "jfl-adapter-lsp", "jfl-composition"]
sleep = ["jfl-testkit"]
clock = ["jfl-process", "jfl-composition", "jfl-testkit", "jfl-bench", "jfl-eval"]
env = ["jfl-process", "jfl-composition", "jfl-cli", "jfl-conformance", "jfl-architecture", "jfl-bench", "jfl-eval", "xtask"]
independent = ["jfl-oracle", "jfl-eval", "jfl-bench", "xtask"]

# The only legal normal edges between workspace crates (plan §6.3).
[dependencies.normal]
jfl-domain = []
jfl-protocol = ["jfl-domain"]
jfl-application = ["jfl-domain"]
jfl-process = []
jfl-adapter-fs = ["jfl-domain", "jfl-application"]
jfl-adapter-git = ["jfl-domain", "jfl-application", "jfl-process"]
jfl-adapter-java = ["jfl-domain", "jfl-application"]
jfl-adapter-classfile = ["jfl-domain", "jfl-application"]
jfl-adapter-store = ["jfl-domain", "jfl-application"]
jfl-adapter-ipc = ["jfl-domain", "jfl-protocol", "jfl-application"]
jfl-adapter-lsp = ["jfl-domain", "jfl-protocol"]
jfl-adapter-javac = ["jfl-domain", "jfl-application", "jfl-process"]
jfl-adapter-gradle = ["jfl-domain", "jfl-application", "jfl-process"]
jfl-composition = ["jfl-domain", "jfl-protocol", "jfl-application", "jfl-process", "jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-java", "jfl-adapter-classfile", "jfl-adapter-store", "jfl-adapter-ipc", "jfl-adapter-lsp", "jfl-adapter-javac", "jfl-adapter-gradle"]
jfl-cli = ["jfl-composition"]
jfl-testkit = ["jfl-domain", "jfl-protocol", "jfl-application"]
jfl-conformance = ["jfl-testkit", "jfl-domain", "jfl-protocol", "jfl-application", "jfl-adapter-ipc", "jfl-composition"]
jfl-architecture = []
jfl-oracle = []
jfl-eval = []
jfl-bench = []
xtask = []

[dependencies.build]

# Third-party crates each crate may name directly, with the features it may enable (fnd §2.5;
# "default" for default features, "*" for any). Each entry says why.
[external.normal]
# The architecture test (FND-07): cargo_metadata reads the graph, toml and serde parse the policy
# and the manifests strictly (`deny_unknown_fields`); ADR 0030. serde_norway reads ci.yml for
# ARCH-ci-lockstep (FND-05): a maintained serde_yaml fork, MIT OR Apache-2.0, no build script.
# sha2 hashes the gate's pinned recipes and scripts for ARCH-gate-config (FND-08): RustCrypto,
# MIT OR Apache-2.0, no build script; the SHA-256 lines read the same as `sha256sum`.
# yaml-rust2 reads every YAML file under .github/ event by event for ARCH-workflow-yaml (FND-09):
# the anchors, aliases and tags a serde reader resolves silently are events here; MIT OR
# Apache-2.0, no build script, default features off (no encoding_rs).
# serde_json parses xtask's stage catalog (`list --json`) for ARCH-ci-lockstep and ARCH-gate-config
# (XT-01): it was a dev-dependency (the synthetic `cargo metadata` JSON of tests/rules.rs) and is in
# the graph through cargo_metadata already.
jfl-architecture = { cargo_metadata = ["default"], serde = ["default", "derive"], serde_json = ["default"], serde_norway = ["default"], sha2 = ["default"], toml = ["default"], yaml-rust2 = [] }
# jfl-bench (BENCH-02, ADR 0031; ADR 0031 amended 2026-11-17): the harness. ignore (the
# .gitignore-aware walk), rayon (the pool), blake3, tree-sitter and the orchard grammar (the E1
# pipeline's stages) reproduce the archived spike; toml reads suites, serde and serde_json write
# results. The tree-sitter crates are wrapped to jfl-bench in deny.toml for the same reason.
# xtask (XT-01, ADR 0035): regex holds the shapes the preflight and the tool configuration check
# ported from awk and sed (the same patterns, line for line); already in the graph (ignore, under
# jfl-bench), MIT OR Apache-2.0, no build script. No clap: a hand parser keeps the launcher's first
# build one crate deep (scripts/xtask.sh). sha2 (XT-02) checks each release asset `install-tools`
# fetches against tools/versions.toml in process, so no hashing program found on PATH can vouch
# for a tampered archive: RustCrypto, MIT OR Apache-2.0, no build script, in the graph already
# (jfl-architecture).
xtask = { regex = ["default"], sha2 = ["default"] }

# jfl-eval (EVAL-01, ADR 0029): toml and serde read the task sets and arms strictly
# (deny_unknown_fields); serde_json reads Harbor's result.json and ATIF trajectories and Claude
# Code's JSONL transcripts and writes the task settings and the JSON report. All three are in the
# graph already (jfl-bench, jfl-architecture); MIT OR Apache-2.0, no build script.
jfl-eval = { serde = ["default", "derive"], serde_json = ["default"], toml = ["default"] }

# jfl-domain (IDX-01): thiserror for its typed refusals (fnd §4.3), without default features so it
# stays no_std (the `nostd` stage builds it for x86_64-unknown-none); already in the graph
# (cargo_metadata), MIT OR Apache-2.0, its build script reviewed in deny.toml.
jfl-domain = { thiserror = [] }

# jfl-protocol (IDX-03): serde (derive) and serde_json for the JSON-RPC payloads, with `alloc` and
# no default features so the crate stays no_std (the `nostd` stage builds it for
# x86_64-unknown-none; plan §16.2, the card's "serde_json with alloc"). thiserror for the typed
# refusals (fnd §4.3). All in the graph already (jfl-architecture, jfl-domain), MIT OR Apache-2.0,
# their build scripts reviewed in deny.toml's bypass list.
jfl-protocol = { serde = ["alloc", "derive"], serde_json = ["alloc"], thiserror = [] }

# jfl-process (IDX-04): rustix gives the safe calls std lacks: the group kill (killpg), the
# leader's exit without reaping it (waitid WNOWAIT), Linux's pidfd and poll(2), so the runner waits
# on both pipes and the exit with no thread and no sleep (plan §16.2 lists rustix 1.1.6); no
# default features. thiserror for the typed errors (fnd §4.3), in the graph already.
jfl-process = { rustix = ["event", "process", "std"], thiserror = ["default"] }

# jfl-conformance (FORMAL-02, ADR 0007 amended 2026-11-17): the ITF replay harness. itf 0.4
# (Informal Systems, Apache-2.0) holds the ITF value tree and decodes a model state into the
# driver's observation; serde_json reads a trace into that tree (as quint-connect does: itf's own
# `trace_from_str` cannot decode into it); serde derives the observations; toml reads the MODELS
# registry and the regression manifest (and FORMAL-01's tests/models.rs); similar (Apache-2.0, no
# dependencies) writes the divergence report's line diff. All in the graph through itf but
# similar. quint-connect was weighed and not taken (ADR 0007's FORMAL-02 amendment).
jfl-conformance = { itf = ["default"], serde = ["default", "derive"], serde_json = ["default"], similar = ["default"], toml = ["default"] }
# jfl-adapter-lsp (LSP-01, ADR 0020): lsp-server (rust-analyzer's message type, which frames
# requests, notifications and errors; ADR 0021) and gen-lsp-types (the LSP types from the 3.18
# metamodel), both pinned exactly and without features: gen-lsp-types' `url` and `fluent-uri`
# features would turn `Uri` into a parsed type and lose the client's spelling, which the proxy
# echoes (LSP-01's decision). serde (derive) and serde_json (std) read and write the messages; in
# the graph already (jfl-protocol, jfl-architecture). lsp-server brings crossbeam-channel and log
# (no build scripts); deny.toml wraps both LSP crates to this adapter and the IPC one.
jfl-adapter-lsp = { gen-lsp-types = [], lsp-server = [], serde = ["default", "derive"], serde_json = ["default"] }
# jfl-testkit (LSP-01): serde_json reads the LSP transcripts (fixtures/lsp/*.jsonl) and the server's
# frames in the transcript runner; in the graph already.
jfl-testkit = { serde_json = ["default"] }

# jfl-application (IDX-06): thiserror for the port's typed refusals (fnd §4.3); in the graph already.
jfl-application = { thiserror = ["default"] }
# jfl-adapter-fs (IDX-06, plan §16.2): ignore (ripgrep's parallel, .gitignore-aware walker; Unlicense
# OR MIT) and notify (inotify, FSEvents; CC0-1.0) with its default features (FSEvents on macOS).
# notify-debouncer-mini, which the card named, was weighed and not taken: it drops the backend's
# overflow event and feeds its thread through an unbounded channel (jfl_application::hints).
# libc (IDX-06 review): the O_NONBLOCK flag for opening a file to read, so a FIFO swapped in for it
# never blocks the read; no default features, in the graph already (notify, rustix), its build
# script reviewed in deny.toml. notify's event-loop thread is notify's own, started and stopped with
# a watch: the crate holds no `spawn` grant and starts no thread itself (fnd §2.4).
jfl-adapter-fs = { ignore = ["default"], libc = [], notify = ["default"] }
# jfl-adapter-git (IDX-05, ADR 0024): no Git crate; libc only for the O_NONBLOCK flag when the hot path
# reads HEAD and loose refs, so a FIFO planted in a Git directory never blocks a request (as
# jfl-adapter-fs does); no default features, in the graph already, its build script reviewed in
# deny.toml.
jfl-adapter-git = { libc = [] }

jfl-bench = { blake3 = ["default"], ignore = ["default"], rayon = ["default"], serde = ["default", "derive"], serde_json = ["default"], toml = ["default"], tree-sitter = ["default"], tree-sitter-java-orchard = ["default"] }

[external.dev]
# xtask (XT-02): toml reads tools/versions.toml, mise.toml and mise.lock in tests/versions.rs, an
# oracle independent of xtask's own pinned-shape reader; in the graph already (jfl-architecture).
xtask = { toml = ["default"] }
# jfl-domain (IDX-01): proptest (std only: no fork, no timeout, so no tempfile or rusty-fork) for
# the property tests (ver §2); line-index (rust-analyzer, ADR 0020) as their independent oracle,
# since it is not no_std and cannot be a normal dependency of a pure crate; divan for the
# in-process position benchmark (doc/bench/README.md), without `wrap_help`, whose terminal_size
# would bring rustix and its build script for a help text. All MIT OR Apache-2.0.
jfl-domain = { divan = ["help"], line-index = ["default"], proptest = ["std"] }
# jfl-protocol (IDX-03): proptest for the frame decoder on arbitrary bytes and the encode-then-decode
# identities (ver §2, §8), divan for the in-process protocol benchmark; the same features as
# jfl-domain's, for the same reasons.
jfl-protocol = { divan = ["help"], proptest = ["std"] }
# jfl-adapter-lsp (LSP-01): proptest for the reader on arbitrary bytes and the session on generated
# traffic (ver §2, §8), divan for the in-process round trip and the typed path's benchmark; the same
# features as jfl-protocol's, for the same reasons.
jfl-adapter-lsp = { divan = ["help"], proptest = ["std"] }
# jfl-adapter-fs (IDX-06): divan for the in-process walk benchmark (`just bench-fs`), with the same
# features as jfl-domain's, for the same reasons.
jfl-adapter-fs = { divan = ["help"] }
# jfl-adapter-git (IDX-05): proptest for the parsers of git's output on arbitrary bytes (ver §8) and
# divan for the per-call benchmark (`just bench-git`), with the same features as jfl-domain's, for
# the same reasons.
jfl-adapter-git = { divan = ["help"], proptest = ["std"] }

[external.build]

[exceptions]
