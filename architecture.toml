# The architecture policy (fnd §3.1, ADR 0010). Parsed strictly by the architecture test
# (FND-07); FND-01 writes the tables, FND-02 and FND-07 enforce them. A crate belongs to exactly
# one category; the edge table is plan §6.3; the grants are fnd §2.4.
schema = 1

[workspace]
production = ["jfl-domain", "jfl-protocol", "jfl-application", "jfl-process", "jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-java", "jfl-adapter-classfile", "jfl-adapter-store", "jfl-adapter-ipc", "jfl-adapter-lsp", "jfl-adapter-javac", "jfl-adapter-gradle", "jfl-composition", "jfl-cli"]
test_only = ["jfl-testkit", "jfl-conformance", "jfl-architecture"]
tool_only = ["jfl-oracle", "jfl-eval", "jfl-jdtls", "jfl-bench", "xtask"]
# fuzz_only = ["jfl-fuzz"] arrives with REL-03 (its own workspace under fuzz/).

[roles]
pure = ["jfl-domain", "jfl-protocol"]
application = ["jfl-application"]
support = ["jfl-process"]
adapter = ["jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-java", "jfl-adapter-classfile", "jfl-adapter-store", "jfl-adapter-ipc", "jfl-adapter-lsp", "jfl-adapter-javac", "jfl-adapter-gradle"]
root = ["jfl-composition", "jfl-cli"]

# What each crate's clippy.toml may drop from the canonical disallowed list (fnd §2.4). The
# git, javac and gradle adapters spawn only through jfl-process, so they hold no process grant.
[grants]
process = ["jfl-process", "jfl-testkit", "jfl-architecture", "jfl-bench", "jfl-eval", "jfl-jdtls", "xtask"]
socket = ["jfl-adapter-ipc", "jfl-jdtls"]
fs = ["jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-store", "jfl-adapter-classfile", "jfl-adapter-javac", "jfl-adapter-gradle", "jfl-adapter-ipc", "jfl-composition", "jfl-testkit", "jfl-conformance", "jfl-architecture", "jfl-bench", "jfl-eval", "jfl-jdtls", "jfl-oracle", "xtask"]
spawn = ["jfl-adapter-ipc", "jfl-composition", "jfl-jdtls"]
sleep = ["jfl-testkit", "jfl-jdtls"]
clock = ["jfl-process", "jfl-composition", "jfl-testkit", "jfl-bench", "jfl-eval", "jfl-jdtls"]
env = ["jfl-process", "jfl-composition", "jfl-cli", "jfl-conformance", "jfl-architecture", "jfl-bench", "jfl-eval", "jfl-jdtls", "xtask"]
independent = ["jfl-oracle", "jfl-eval", "jfl-jdtls", "jfl-bench", "xtask"]

# The only legal normal edges between workspace crates (plan §6.3).
[dependencies.normal]
jfl-domain = []
jfl-protocol = ["jfl-domain"]
jfl-application = ["jfl-domain"]
jfl-process = []
jfl-adapter-fs = ["jfl-domain", "jfl-application"]
jfl-adapter-git = ["jfl-domain", "jfl-application", "jfl-process"]
jfl-adapter-java = ["jfl-domain", "jfl-application"]
jfl-adapter-classfile = ["jfl-domain", "jfl-application"]
jfl-adapter-store = ["jfl-domain", "jfl-application"]
jfl-adapter-ipc = ["jfl-domain", "jfl-protocol", "jfl-application"]
jfl-adapter-lsp = ["jfl-domain", "jfl-protocol"]
jfl-adapter-javac = ["jfl-domain", "jfl-application", "jfl-process"]
jfl-adapter-gradle = ["jfl-domain", "jfl-application", "jfl-process"]
jfl-composition = ["jfl-domain", "jfl-protocol", "jfl-application", "jfl-process", "jfl-adapter-fs", "jfl-adapter-git", "jfl-adapter-java", "jfl-adapter-classfile", "jfl-adapter-store", "jfl-adapter-ipc", "jfl-adapter-lsp", "jfl-adapter-javac", "jfl-adapter-gradle"]
jfl-cli = ["jfl-composition"]
jfl-testkit = ["jfl-domain", "jfl-protocol", "jfl-application"]
jfl-conformance = ["jfl-testkit", "jfl-domain", "jfl-protocol", "jfl-application", "jfl-adapter-ipc", "jfl-composition"]
jfl-architecture = []
jfl-oracle = []
jfl-eval = []
jfl-jdtls = []
jfl-bench = []
xtask = []

[dependencies.build]

# Third-party crates each crate may name directly, with the features it may enable (fnd §2.5;
# "default" for default features, "*" for any). Each entry says why.
[external.normal]
# The architecture test (FND-07): cargo_metadata reads the graph, toml and serde parse the policy
# and the manifests strictly (`deny_unknown_fields`); ADR 0030. serde_norway reads ci.yml for
# ARCH-ci-lockstep (FND-05): a maintained serde_yaml fork, MIT OR Apache-2.0, no build script.
# sha2 hashes the gate's pinned recipes and scripts for ARCH-gate-config (FND-08): RustCrypto,
# MIT OR Apache-2.0, no build script; the SHA-256 lines read the same as `sha256sum`.
# yaml-rust2 reads every YAML file under .github/ event by event for ARCH-workflow-yaml (FND-09):
# the anchors, aliases and tags a serde reader resolves silently are events here; MIT OR
# Apache-2.0, no build script, default features off (no encoding_rs).
# serde_json parses xtask's stage catalog (`list --json`) for ARCH-ci-lockstep and ARCH-gate-config
# (XT-01): it was a dev-dependency (the synthetic `cargo metadata` JSON of tests/rules.rs) and is in
# the graph through cargo_metadata already.
jfl-architecture = { cargo_metadata = ["default"], serde = ["default", "derive"], serde_json = ["default"], serde_norway = ["default"], sha2 = ["default"], toml = ["default"], yaml-rust2 = [] }
# jfl-jdtls (EVAL-11, ADR 0028): serde_json parses only the JSON-RPC envelope and forwards params,
# result and error as raw values (raw_value); serde derives the envelope; sha1_smol keys jdtls's
# -data on the full worktree path; rustix gives the effective uid, the socket peer's uid and the
# process-group kill that std lacks.
jfl-jdtls = { rustix = ["net", "process", "std"], serde = ["default", "derive"], serde_json = ["default", "raw_value"], sha1_smol = ["default"] }

# jfl-bench (BENCH-02, ADR 0031; ADR 0031 amended 2026-11-17): the harness. ignore (the
# .gitignore-aware walk), rayon (the pool), blake3, tree-sitter and the orchard grammar (the E1
# pipeline's stages) reproduce the archived spike; toml reads suites, serde and serde_json write
# results. The tree-sitter crates are wrapped to jfl-bench in deny.toml for the same reason.
# xtask (XT-01, ADR 0035): regex holds the shapes the preflight and the tool configuration check
# ported from awk and sed (the same patterns, line for line); already in the graph (ignore, under
# jfl-bench), MIT OR Apache-2.0, no build script. No clap: a hand parser keeps the launcher's first
# build one crate deep (scripts/xtask.sh). sha2 (XT-02) checks each release asset `install-tools`
# fetches against tools/versions.toml in process, so no hashing program found on PATH can vouch
# for a tampered archive: RustCrypto, MIT OR Apache-2.0, no build script, in the graph already
# (jfl-architecture).
xtask = { regex = ["default"], sha2 = ["default"] }

jfl-bench = { blake3 = ["default"], ignore = ["default"], rayon = ["default"], serde = ["default", "derive"], serde_json = ["default"], toml = ["default"], tree-sitter = ["default"], tree-sitter-java-orchard = ["default"] }

[external.dev]
# xtask (XT-02): toml reads tools/versions.toml, mise.toml and mise.lock in tests/versions.rs, an
# oracle independent of xtask's own pinned-shape reader; in the graph already (jfl-architecture).
xtask = { toml = ["default"] }

[external.build]

[exceptions]
