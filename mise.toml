# Every tool other than Rust, pinned exactly (fnd §8, ADR 0030). mise.lock records the
# checksums and download URLs; `mise install --locked` refuses a mismatch.
[tools]
# The gate runner (FND-01). The version must equal JUST_VERSION in scripts/bootstrap-tools.sh;
# `just doctor` compares them.
just = "1.59.0"
# The test runner (FND-01); prebuilt release asset, no compile in a fresh session.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"

# Licences, advisories, sources and bans: the `deny` stage (FND-02); prebuilt release asset.
"aqua:EmbarkStudios/cargo-deny" = "0.21.0"

# ADR tooling: `adrs new` (FND-03, ADR 0030). No aqua registry entry, so the github backend over the
# project's dist release assets; the lock entries carry the SHA-256 of each asset (sha256.sum of
# the release). Version 0.13.0 is the current release on 2026-11-17.
"github:joshrotenberg/adrs" = "0.13.0"

# Security and supply chain (FND-04, fnd §7.3, §7.4, §8): secret scan, workflow audits, shell lint.
# Prebuilt release assets from the aqua registry, so a fresh session installs them from the lock.
# Versions are the current releases on 2026-11-17.
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:suzuki-shunsuke/pinact" = "5.0.2"
"aqua:koalaman/shellcheck" = "0.11.0"

# The benchmark harness's timer and its `rg` floor (BENCH-02, `just bench`).
"aqua:sharkdp/hyperfine" = "2.0.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
