[package]
name = "jfl-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false
description = "Paths and URIs, positions and encodings, symbols, file summaries, cache keys, the result envelope and generation policies: pure data and functions with no I/O."

[lints]
workspace = true

[dependencies]
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
divan = { version = "0.1.21", default-features = false, features = ["help"] }
line-index = "0.1.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

# Offset <-> position conversion in process (doc/bench/README.md); `just bench-domain SIZE`.
[[bench]]
name = "positions"
harness = false

# The envelope, completeness and summaries in process (IDX-02); `just bench-domain-envelope`.
[[bench]]
name = "envelope"
harness = false
