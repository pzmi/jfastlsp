[package]
name = "jfl-composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false
description = "Wiring for the daemon and the proxies: runtime and task supervision and the daemon launcher."

[dependencies]
jfl-domain = { path = "../jfl-domain" }
jfl-protocol = { path = "../jfl-protocol" }
jfl-application = { path = "../jfl-application" }
jfl-process = { path = "../jfl-process" }
jfl-adapter-fs = { path = "../jfl-adapter-fs" }
jfl-adapter-git = { path = "../jfl-adapter-git" }
jfl-adapter-java = { path = "../jfl-adapter-java" }
jfl-adapter-classfile = { path = "../jfl-adapter-classfile" }
jfl-adapter-store = { path = "../jfl-adapter-store" }
jfl-adapter-ipc = { path = "../jfl-adapter-ipc" }
jfl-adapter-lsp = { path = "../jfl-adapter-lsp" }
jfl-adapter-javac = { path = "../jfl-adapter-javac" }
jfl-adapter-gradle = { path = "../jfl-adapter-gradle" }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "net", "time", "signal", "macros", "sync"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
serde_json = "1.0.154"
thiserror = "2"
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true

# The syntax index on the bench corpus (`just bench-syntax SIZE`, IDX-07); reports, never gates.
[[bench]]
name = "syntax"
harness = false

# Syntax diagnostics through the diagnostics coordinator on the bench corpus
# (`just bench-diagnostics SIZE`, LSP-04); reports, never gates.
[[bench]]
name = "diagnostics"
harness = false

# The summary store on the bench corpus (`just bench-store SIZE [cold]`, IDX-08); reports, never
# gates.
[[bench]]
name = "store"
harness = false

# The view registry on the bench corpus (`just bench-views SIZE`, IDX-09); reports, never gates.
[[bench]]
name = "views"
harness = false

# The view service over the real adapters on the bench corpus (the second half of
# `just bench-views SIZE`, IDX-09); reports, never gates.
[[bench]]
name = "view_service"
harness = false

# The queries on the bench corpus (`just bench-queries SIZE`, IDX-10); reports, never gates.
[[bench]]
name = "queries"
harness = false

# The daemon's IPC as a client meets it (`just bench-daemon`, IDX-12): spawn to ready, connect and
# handshake, a trivial request's round trip; reports, never gates.
[[bench]]
name = "daemon"
harness = false

[dev-dependencies]
jfl-testkit = { path = "../jfl-testkit" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

# The daemon for this crate's own tests (tests/daemon.rs); see its doc comment.
[[bin]]
name = "jfl-composition-test-daemon"
path = "src/bin/jfl-composition-test-daemon.rs"
test = false
