[package]
name = "jfl-adapter-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false
description = "The Unix socket endpoint (server and client), the state-directory lock, peer checks and framing."

[dependencies]
jfl-domain = { path = "../jfl-domain" }
jfl-protocol = { path = "../jfl-protocol" }
jfl-application = { path = "../jfl-application" }
tokio = { version = "1.52.3", default-features = false, features = ["net", "io-util"] }
rustix = { version = "1.1.6", default-features = false, features = ["event", "std", "process"] }
lsp-server = { version = "=0.10.0", default-features = false }
serde_json = "1.0.154"
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["rt"] }
