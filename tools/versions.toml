# Every tool mise.toml pins, with what `xtask install-tools` downloads for each platform of ADR 0006
# (XT-02, ADR 0035, fnd §8): the version, the mise.toml key it stands for, the command that prints
# the installed version (`doctor` looks for the version as a whitespace-separated word, a leading
# `v` ignored), and per platform the release asset's URL, its SHA-256 and the program's path
# inside the archive. The URL and SHA-256 are mise.lock's for the same tool and platform: until
# XT-08 removes mise both install paths exist, and `doctor` fails when the two files disagree
# (tools/xtask/src/versions.rs, pinned by tools/xtask/tests/versions.rs). A version bump changes
# mise.toml, mise.lock and this file in one commit.
#
# The shape is pinned, not a TOML subset read loosely: comments, blanks, `[tools.<name>]` with
# `version`, `mise` and `probe` (and optionally `kind` and `prints`), then
# `[tools.<name>.<platform>]` for linux-x64, linux-arm64 and macos-arm64, each with `url` (a GitHub
# release asset, `https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>`, a `+` written
# `%2B`: never api.github.com, which the sandbox's proxy refuses; or Node's archive under
# `https://nodejs.org/dist/`), `sha256` (64 lowercase hex digits) and `bin`. `kind` is absent (the
# archive's one program is kept), `tree` (the whole archive is kept, for a program that needs its
# siblings) or `npm` (a tool mise installs from its locked npm graph: no platform tables); `prints`
# is the word the probe prints when it is not `version`; `only = "formal-verify"` marks a tool
# the gate does not need, installed on request and optional in `doctor` (FORMAL-01). Any other
# line fails `doctor`, `install-tools` and every gate command.

# The gate runner (FND-01); equals JUST_VERSION in scripts/bootstrap-tools.sh.
[tools.just]
version = "1.59.0"
mise = "just"
