# Quint, the `formal-*` stages' model checker front end. `kind = "npm"`: no per-platform asset;
# mise installs its locked graph (.mise/locks/npm-informalsystems-quint/, every package's sha512)
# and `install-tools` refuses it, naming `mise install --locked`, until XT-08 gives xtask an npm
# install of its own.
[tools.quint]
version = "0.33.1"
mise = "npm:@informalsystems/quint"
probe = ["quint", "--version"]
kind = "npm"

# The Temurin JDK 21: runs Apalache (later the Java fixtures and the JVM helpers). mise names the
# release `temurin-21.0.13+9.0.LTS`; `java --version` prints the build as `Temurin-21.0.13+9`,
# which `prints` names for `doctor`. Only `formal-verify` needs it (`only`), so the bootstrap
# installs it only with `--formal-verify`.
[tools.jdk]
version = "temurin-21.0.13+9.0.LTS"
mise = "java"
probe = ["java", "--version"]
kind = "tree"
