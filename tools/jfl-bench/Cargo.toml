[package]
name = "jfl-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false
description = "The benchmark harness over the pinned corpus and the comparison arms; imports no production crate."

[[bin]]
name = "jfl-bench"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
ignore = "0.4.34"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tree-sitter = "0.27.2"
tree-sitter-java-orchard = "0.5.25"
