# The platform tests on macOS arm64 (ADR 0006, fnd §7.2 rule 4), nightly and by hand: reported,
# not blocking (the owner's decision at the FORMAL checkpoint, 2026-11-18, option B; BOOT-04): the
# job left ci.yml and `Required`, and a red run is reported to the owner and fixed as a task, like
# formal.yml's. Linux arm64 stays in ci.yml and `Required`. The job is
# built exactly like a ci.yml job, and ARCH-ci-lockstep (tools/jfl-architecture/src/ci.rs) holds it
# to the same rules: the same setup and allowed actions, one `just` command per step, no `if:`,
# no `continue-on-error`, no steering `env:`; `on:` only `schedule` and `workflow_dispatch`, no
# stage of `check` (those run in ci.yml), and its row in doc/required-checks.md.
name: macOS

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

# An explicit bash runs with -e -o pipefail on every runner.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Every failure reported and a JUnit file (.config/nextest.toml); _preflight accepts it.
  NEXTEST_PROFILE: ci

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: f9ea45f740c0f96e564af0303fdc54d81230c36c8409de9084d14e1639e1d158 # macos-arm64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mise-${{ hashFiles('mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just platform-tests
