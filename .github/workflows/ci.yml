# The gate in CI (fnd §7.2, doc/required-checks.md): every job sets up the pinned tools and runs
# the same `just` recipes as a laptop; `Required` aggregates them. The architecture test's
# ARCH-ci-lockstep (tools/jfl-architecture/src/ci.rs) fails when this file, xtask's stage
# catalog (`list --json`) and doc/required-checks.md disagree, or when a job could fail without failing
# `Required`: no `if:` but the aggregate's, no `continue-on-error`, no swallowed exit status, no
# environment that steers the build.
#
# Every job's setup: mise at scripts/bootstrap-tools.sh's MISE_VERSION, its binary checked against
# the SHA-256 for the runner's platform (ADR 0006; the bare binary's line of the release's
# SHASUMS256.txt, equal to the binary inside each archive), then `mise install --locked` of the
# tools the job runs (ci.rs's CI_TOOLS; Node and Quint only in `formal`, the JDK and Apalache
# never: formal.yml installs them); the
# toolchain of rust-toolchain.toml; the cargo cache, keyed by the toolchain and Cargo.lock
# (rust-cache's own key) and mise.lock, saved only from main (fnd §7.3). Written out per job
# rather than as a local action: zizmor wants the `$/` self-repository form, which actionlint
# does not parse yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Per commit on main (a newer push neither cancels nor replaces a pending run), per ref elsewhere;
# only a pull request's older run is cancelled (fnd §7.3).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# An explicit bash runs with -e -o pipefail on every runner.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Every failure reported and a JUnit file (.config/nextest.toml); _preflight accepts it.
  NEXTEST_PROFILE: ci

jobs:
  architecture:
    name: Architecture and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be # linux-x64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mise-${{ hashFiles('mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just check-only architecture deny

  static:
    name: Static quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be # linux-x64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mise-${{ hashFiles('mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just check-only fmt-check clippy nostd docs

  tests:
    name: Tests (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be # linux-x64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mise-${{ hashFiles('mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just check-only unit-tests integration-tests doctests script-tests

  linux-arm:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: 3978fbccfa2284b12e46cbf6df53cae118ec1f2fa780b6a204e6c9c792b620f6 # linux-arm64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mise-${{ hashFiles('mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just platform-tests

  macos:
    name: macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: f9ea45f740c0f96e564af0303fdc54d81230c36c8409de9084d14e1639e1d158 # macos-arm64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mise-${{ hashFiles('mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just platform-tests

  formal:
    name: Formal models (Quint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be # linux-x64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep node npm:@informalsystems/quint
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mise-${{ hashFiles('mise.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just doctor
      - run: just check-only formal-typecheck formal-test formal-freshness conformance-replay

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The full history: gitleaks refuses a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be # linux-x64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      - run: just check-only secrets workflows
      # pinact's version-comment check asks the GitHub API (fnd §7.3); the job's read-only token
      # lifts the rate limit.
      - run: just workflows-verify
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: mise and the tools of mise.lock
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.10.10
          sha256: 7d79972e15549b286dcf9e25ef8c4fcef3d9fd7c0332d11cdfbc7d2842c418be # linux-x64
          install_args: --locked just aqua:nextest-rs/nextest/cargo-nextest aqua:EmbarkStudios/cargo-deny github:joshrotenberg/adrs aqua:gitleaks/gitleaks aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:suzuki-shunsuke/pinact aqua:koalaman/shellcheck aqua:sharkdp/hyperfine aqua:BurntSushi/ripgrep
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          # mise.toml's [env] stays out of the gate's environment (ARCH-ci-lockstep).
          env: false
      # The pushed commits (before..after), a pull request's commits (base..head), or the commit
      # itself on a manual run (scripts/dco-check.sh --event). A push whose `before` is all zeros
      # (a first push or a recreated main) or not in the history (a force-push) fails: main is
      # neither (ADR 0002); check such a range by hand with `just dco <range>`.
      - name: Every pushed commit is signed off by its author
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: just dco-event "$EVENT" "$BEFORE" "$BASE" "$HEAD_SHA"

  required:
    name: Required
    if: always()
    needs: [architecture, static, tests, linux-arm, macos, formal, security, dco]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [ -n "$RESULTS" ] || { echo "required: no job results" >&2; exit 1; }
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "required: a job ended '$result': $RESULTS" >&2; exit 1; }
          done
          echo "required: every job succeeded ($RESULTS)"
