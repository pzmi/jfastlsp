# OpenSSF Scorecard (fnd §7.1): the supply-chain checks of the default branch, as SARIF in code
# scanning and published to the Scorecard API (the public badge). Scorecard refuses a workflow
# with `run:` steps or extra write permissions when it publishes, so this file stays minimal.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published results (publish_results).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
