# cargo-deny policy skeleton (fnd §7.4). FND-02 runs it as the `deny` stage and adds the
# `wrappers`, `[[bans.features]]` and build-script entries of fnd §2.5; no third-party crate
# exists yet, so only the graph, sources and base rules are set.
[graph]
# The three targets of ADR 0006.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"

[licenses]
# Permissive allowlist; a per-crate exception needs an ADR (fnd §7.4).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "BSD-3-Clause",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
