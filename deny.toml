# cargo-deny policy (fnd §2.5, §7.4; ADR 0030): the `deny` stage, `cargo deny --locked check`.
# Advisories, licences, sources and bans: the transitive half of the dependency law, where the
# architecture test (FND-07) holds the direct half. A widened entry needs the task to say so and
# an ADR (fnd §3.5).
[graph]
# The three targets of ADR 0006.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive allowlist of plan §16.2; a per-crate exception needs an ADR (fnd §7.4).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "BSD-3-Clause",
  "Unicode-3.0",
]
# The allowlist is the plan's, not the graph's: most are not encountered yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; every registry dependency must.
allow-wildcard-paths = true
# `wrappers`: each adapter-only crate may be a direct dependency only of the crates named, so it
# stays out of every other crate's closure (fnd §2.5). That this applies to workspace path crates
# is pinned by tools/jfl-architecture/tests/gate_negative_cases.rs
# ::should_fail_deny_bans_when_a_path_crate_is_wrapped_to_the_wrong_parent.
# Until the adapters add these crates, cargo-deny warns `unused-wrapper` for each (it has no
# setting to silence it); the warnings do not fail the stage.
# `use-instead`: the rejected options of plan §16.3.
deny = [
  { crate = "tokio", wrappers = ["jfl-composition", "jfl-adapter-ipc", "tokio-util"], reason = "the async runtime is daemon-side only: composition and the IPC adapter (plan §16.2)" },
  { crate = "tokio-util", wrappers = ["jfl-composition", "jfl-adapter-ipc"], reason = "daemon-side only (plan §16.2)" },
  { crate = "rusqlite", wrappers = ["jfl-adapter-store"], reason = "storage is the store adapter's (ADR 0025)" },
  { crate = "tree-sitter", wrappers = ["jfl-adapter-java", "tree-sitter-java-orchard"], reason = "the Java grammar is the Java adapter's (ADR 0022)" },
  { crate = "tree-sitter-java-orchard", wrappers = ["jfl-adapter-java"], reason = "the Java grammar is the Java adapter's (ADR 0022)" },
  { crate = "lsp-server", wrappers = ["jfl-adapter-lsp", "jfl-adapter-ipc"], reason = "LSP framing lives in the LSP and IPC adapters (ADR 0020, ADR 0021)" },
  { crate = "gen-lsp-types", wrappers = ["jfl-adapter-lsp"], reason = "LSP types are the LSP adapter's (ADR 0020)" },
  { crate = "anyhow", wrappers = ["jfl-cli", "jfl-architecture", "jfl-oracle", "jfl-eval", "jfl-jdtls", "jfl-bench"], reason = "anyhow only in binaries and tools (ARCH-anyhow-in-library)" },
  { crate = "lsp-types", use-instead = "gen-lsp-types", reason = "stalled since 2024 (plan §16.3)" },
  { crate = "tower-lsp", use-instead = "lsp-server", reason = "unmaintained (plan §16.3)" },
  { crate = "git2", reason = "linked-worktree gap and a C build: the git CLI (ADR 0024)" },
  { crate = "gix", reason = "linked-worktree gap: the git CLI (ADR 0024)" },
  { crate = "bincode", use-instead = "postcard", reason = "unmaintained, RUSTSEC-2025-0141 (plan §16.3)" },
  { crate = "fs2", reason = "std file locks since Rust 1.89 (plan §16.3)" },
  { crate = "fs4", reason = "std file locks since Rust 1.89 (plan §16.3)" },
  { crate = "fd-lock", reason = "std file locks since Rust 1.89 (plan §16.3)" },
  { crate = "daemonize", reason = "fork() in a threaded process (plan §16.3)" },
]
# Features a crate may not enable (plan §16.2).
features = [
  { crate = "zip", deny = ["default"], reason = "zip without default features, deflate on (plan §16.2)" },
]

[bans.build]
# Only the crates named here may run a build script (fnd §2.2 rule 5), workspace crates included
# (cargo-deny skips them by default). Production crates have none yet: the tree-sitter grammars
# and bundled SQLite compile C and are added by name, with the reason, by the task that adds them
# (IDX-07, IDX-08). Pinned by tools/jfl-architecture/tests/gate_negative_cases.rs
# ::should_fail_deny_bans_when_a_workspace_crate_has_a_build_script.
include-workspace = true
allow-build-scripts = []
# FND-07 (ADR 0030, amended 2026-11-17): the architecture test's cargo_metadata, serde and toml
# bring eight build scripts that only probe rustc or the target and set cfgs (no C, no network,
# read by hand). Each is allowed only with the SHA-256 of its build.rs as reviewed: a new version
# whose script changed fails `bans` until someone reads it and updates the checksum. The bypass is
# by crate, not by dependent, so a production crate pulling serde later reuses the review; the
# task that does so says so.
bypass = [
  # camino: rustc version probe (cargo_metadata's paths), cfgs only; jfl-architecture's closure.
  { crate = "camino", build-script = "5bc29910c9644c320a7cceed121474915f7e832f484f1bf694dec80a45182aa0" },
  # proc-macro2: rustc version probe (serde_derive), cfgs only; jfl-architecture's closure.
  { crate = "proc-macro2", build-script = "baeb20b52f6b536be8657a566591a507bb2e34a45cf8baa42b135510a0c3c729" },
  # quote: rustc version probe (serde_derive), cfgs only; jfl-architecture's closure.
  { crate = "quote", build-script = "cd6808c02e476b09a520105e2c6f6d325cccb1ecd542cbbcc836a0ae6f6fb0f1" },
  # serde: rustc version probe, cfgs only; jfl-architecture's closure.
  { crate = "serde", build-script = "e2ea6a7a82f5404c3e28cb055883c737ee7903367a10206fbb47b75c009f0eb3" },
  # serde_core: rustc version probe, cfgs only; jfl-architecture's closure.
  { crate = "serde_core", build-script = "7bc6b1eec8913ff4cd8e4b9b92cd04a82a4f38beb30a0b73a64c1e6e49f07b5f" },
  # serde_json: target-arch probe (cargo_metadata), cfgs only; jfl-architecture's closure.
  { crate = "serde_json", build-script = "a681e754be844c7dbef957f5d2d00b01f37c5dca160ef1055a8d8f975697a881" },
  # thiserror: rustc feature probe (cargo_metadata), cfgs only; jfl-architecture's closure.
  { crate = "thiserror", build-script = "ccc38283604f99237ad2333bbe395259e29fdf2ff4e04a60a95de9e4499c09a3" },
  # zmij: rustc probe (serde_json's float formatting), cfgs only; jfl-architecture's closure.
  { crate = "zmij", build-script = "ad320bc635887879bdbbf1b9322da4a157ec2c5a4243bd7c2cf9b6884a3b2a41" },
  # EVAL-11 (ADR 0028, amended 2026-11-17): jfl-jdtls reuses the serde and serde_json entries above,
  # and adds rustix (geteuid, the peer uid, process-group kill) with libc, its macOS backend.
  # rustix: rustc feature probes (compiles probe snippets with $RUSTC), cfgs only; jfl-jdtls's closure.
  { crate = "rustix", build-script = "f7609b919173e7121493266d0f89db724a1e47bb105ebd05397f869639603eec" },
  # libc: rustc version probe and target cfgs, cfgs only; rustix's libc backend (macOS).
  { crate = "libc", build-script = "e70593206df4d2a3138eab463567e0ae8f91c1bea565da4ab5370ea8986840ac" },
]

[sources]
# crates.io only (ARCH-external-source).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
